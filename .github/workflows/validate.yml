name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate self-contained skills
        run: python scripts/validate.py
      - name: Regression checks
        run: python -m unittest discover -s tests -v
      - name: Compile examples and helpers
        run: python -m compileall -q examples/clinic-agent scripts
      - name: Reference validator
        run: |
          pip install --quiet skills-ref==0.1.1
          for skill in skills/*/; do
            agentskills validate "$skill" || exit 1
          done

  installed-layout:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [copy, symlink]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - run: python scripts/test_installs.py --mode ${{ matrix.mode }}

  sdk-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned SDKs
        run: pip install 'livekit-agents==1.8.1' 'pipecat-ai[daily,deepgram,cartesia,openai,silero]==1.10.0' python-dotenv
      - name: SDK contracts with fake I/O
        run: python -m unittest discover -s tests/sdk -v
