name: adapter drift

# Weekly: compare each adapter's pinned version and verification date with what has
# shipped since. Drift is reported in the run summary and as refresh issues; it never
# fails a build.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Report drift and open missing refresh issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/adapter_drift.py --summary "$GITHUB_STEP_SUMMARY" --open-issues
