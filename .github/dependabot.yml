version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    labels: ["deps", "ci"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    labels: ["deps"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      site:
        patterns: ["*"]
