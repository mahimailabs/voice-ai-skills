name: Tooling bug
description: The validator, a script, the installer, or the clinic example is broken.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and the full output.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.12, Node 22.20, macOS 15"
    validations:
      required: true
